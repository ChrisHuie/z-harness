name: harness-check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.14
      - name: install zsh where the runner image omits it
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y zsh && break
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          zsh --version
      - name: source-bound bootstrap and complete offline gate
        run: |
          python3 hooks/harness_check.py --ci
          python3 tools/ci-gate.py

  portable-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.14
      - name: pinned upstream conformance
        run: python3 tools/portable-conformance.py
